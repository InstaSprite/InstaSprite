syntax = "proto3";

option java_package = "com.instasprite.app";
option java_multiple_files = true;

message CelData {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  bytes pixels = 5;
}

message LayerData {
  string id = 1;
  string name = 2;
  bool is_visible = 3;
  bool is_locked = 4;
  bytes pixels = 5;
  CelData cel = 6;
  float opacity = 7;
  string blend_mode = 8;
  bool is_clipping = 9;
}

message ISprite {
  repeated LayerData layers = 1;
  repeated int32 color_palette = 2;
  int32 width = 3;
  int32 height = 4;
  int32 format_version = 5;
  repeated AnimationFrameData frames = 6;
  repeated AnimationCelData cels = 7;
  repeated AnimationImageData images = 8;
  string poster_frame_id = 9;
  bool unfinished_session = 10;
  string active_frame_id = 11;
  string active_layer_id = 12;
}

message AnimationFrameData {
  string id = 1;
  int32 duration_ms = 2;
  repeated string clipping_layer_ids = 3;
}

message AnimationCelData {
  string id = 1;
  string layer_id = 2;
  string frame_id = 3;
  string data_id = 4;
}

message AnimationImageData {
  string id = 1;
  bytes tiles = 2;
}
